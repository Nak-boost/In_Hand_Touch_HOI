defaults:
  - config
  - _self_

stage: teacher  # grasps | teacher | student | evaluate | smoke
run_name: null  # autogenerated; reuse is rejected to protect results
run_root: ../runs/manip
teacher_checkpoint: null
student_checkpoint: null
evaluation_steps: 600
headless: true
num_envs: 1024
pipeline: cpu  # Pair identities require CPU tensors; PhysX and PPO still run on CUDA.

task:
  name: AllegroDigitTwoAxis
  rl_device: ${..rl_device}
  env:
    numObservations: 71
    episodeLength: 600
    envSpacing: 0.4
    asset:
      handAsset: assets/allegro/allegro_digit_official_inward90.urdf
    controller:
      pgain: 3.0
      dgain: 0.1
      controlFrequencyInv: 6
      torque_control: true
    digit:
      contact_threshold: 0.10  # N, only for simulated contact detection
      dropout: 0.02
      latency_steps: 1
    manipulation:
      axes: [[0, 0, 1]]           # fixed +Z, palm-up horizontal rotation
      switch_steps: 0            # single-axis baseline; no switching
      random_initial_axis: false
      target_speed: 0.5           # rad/s
      action_scale: 0.026         # radians / policy step
      action_smoothing: 0.5
      action_reference: actual_position  # q_target = clamp(q_actual + scaled smoothed action)
      joint_noise: 0.01
      velocity_noise: 0.02
      max_displacement: 0.13
      min_height: 0.53
      goal_increment: 0.5235987756  # 30 degrees, teacher auxiliary incremental goal
      goal_tolerance: 0.15         # rad
      student_goal_tolerance: 0.25
      rotation_weight: 1.0
      off_axis_weight: 0.15
      off_axis_cost_cap: 0.5      # smooth cap on weighted off-axis cost; 0 restores quadratic
      overspeed_weight: 0.1
      overspeed_cost_cap: 0.25   # smooth cap on weighted overspeed cost; 0 restores quadratic
      goal_weight: 0.25
      contact_weight: 0.05
      object_contact_filter: true  # Only gel-object normal loads qualify for task contact reward/failure.
      fingertip_distance_weight: 0.1  # Rotating without Seeing Appendix D; gel apex -> object center
      housing_weight: 0.05
      position_weight: 2.0
      linear_velocity_weight: 0.1
      action_rate_weight: 0.02
      torque_weight: 0.01
      pose_weight: 0.05           # same HORA pose cost, reduced after scripted scale calibration
      limit_push_weight: 0.25     # mean blocked increment / action_scale; inward commands are free
      drop_penalty: 250.0         # raw units; PPO scales rewards by 0.01; see docs/reward_control_tuning.md
      history_length: 30
    objects:
      # Different rigid object identities; per-asset cache prevents cross-shape resets.
      - {name: sphere55, shape: sphere, size: [0.055, 0.055, 0.055]}
    grasp:
      cache: cache/digit_sphere55_official_grasps_inward90.pt
      required_per_object: 64
      candidate_steps: 80
      warmup_steps: 25
      max_batches: 200
      q_noise: 0.22
      canonical_q: [0.08, 1.1, 0.4, 0.35, 0.0, 1.1, 0.4, 0.35, 0.0, 1.1, 0.4, 0.35, 1.1, 1.0, 0.8, 0.4]
      object_position: [-0.01, -0.01, 0.64]
    domain:
      mass: [0.03, 0.12]
      friction: [0.6, 1.5]
      com: 0.003
      gain_scale: [0.9, 1.1]
  sim:
    dt: 0.008333333333333333
    physx:
      contact_offset: 0.001
      num_velocity_iterations: 1

train:
  network:
    mlp: {units: [256, 256, 128]}
    priv_mlp: {units: [128, 64, 8]}
  ppo:
    priv_info: true
    priv_info_dim: 23
    proprio_adapt: false
    horizon_length: 16
    minibatch_size: 8192
    mini_epochs: 4
    learning_rate: 0.0003
    max_agent_steps: 100000000
    save_frequency: 100
    # Task auto-resets; disable HORA's approximate timeout bootstrap.
    value_bootstrap: false

distill:
  steps: 100000
  learning_rate: 0.0003
  action_weight: 1.0
  latent_weight: 1.0
  grad_norm: 1.0
  save_every: 1000
