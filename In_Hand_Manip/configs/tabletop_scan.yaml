  center: [0.0, 0.0, 0.54]
  opening_clearance: 0.009
  normal_weight: 0.015
  ik_damping: 0.003
  max_joint_step: 0.026
  force_filter: 0.4
  contact_on: 0.12
  contact_off: 0.06
  hold_force: 0.5
  abort_force: 3.0
  force_gain: 0.002
  approach_speed: 0.004
  max_closure: 0.025
  required_contacts: 4
  minimum_rotation_contacts: 2
  contact_dwell: 0.15
  settle_seconds: 0.5
  hold_seconds: 0.3
  approach_timeout: 8.0
  rotation_degrees: 10.0
  rotate_seconds: 1.5
  max_rotation_compliance: 0.003
  loss_grace_seconds: 0.4
  release_speed: 0.01
  release_min_seconds: 0.5
  release_dwell: 0.15
  release_timeout: 3.0
  reset_speed: 0.015
  reset_tolerance: 0.002
  reset_timeout: 5.0
